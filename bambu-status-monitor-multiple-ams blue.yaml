binary_sensor:
  - platform: homeassistant
    id: ha_online
    entity_id: binary_sensor.${printer}_online
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: lbl_online_status
                  text: "Online"
              - lvgl.widget.update:
                  id: lbl_online_status
                  text_color: 0x8919FF   # displays as green 0x00E676
            else:
              - lvgl.label.update:
