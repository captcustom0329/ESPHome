# ─── Touchscreen ────────────────────────────────────────────────────────────

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    interrupt_pin:
      number: 3
      ignore_strapping_warning: true
    reset_pin: GPIO38
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - script.execute: inactivity_timer

# ─── Globals ─────────────────────────────────────────────────────────────────

globals:
  - id: selected_ams
    type: int
    restore_value: yes
    initial_value: '1'

