              return std::string(buf);

  - platform: homeassistant
    id: ha_bed_target
    entity_id: sensor.${printer}_bed_target_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_bed_target
            text: !lambda |-
              if ((int)x == 0) return std::string("Off");
              char buf[16]; snprintf(buf, sizeof(buf), "/ %.0f°C", x);
              return std::string(buf);

  - platform: homeassistant
    id: ha_chamber_temp
    entity_id: sensor.${printer}_chamber_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_chamber_temp
            text: !lambda |-
              char buf[16]; snprintf(buf, sizeof(buf), "%.0f°C", x);
              return std::string(buf);

  - platform: homeassistant
    id: ha_remaining_time
    entity_id: sensor.${printer}_remaining_time
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_remaining_time
            text: !lambda |-
              int mins = (int)x;
              if (mins <= 0) return std::string("Done");
              int h = mins / 60; int m = mins % 60;
              char buf[16];
              if (h > 0) snprintf(buf, sizeof(buf), "%dh %dm", h, m);
              else snprintf(buf, sizeof(buf), "%dm", m);
              return std::string(buf);

  - platform: homeassistant
    id: ha_current_layer
