substitutions:
  device_name: bambu-lab-monitor
  friendly_name: Bambu Lab Monitor
  printer: x1c

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - script.execute: inactivity_timer
      - component.update: my_display

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: "your api Key here"

ota:
  - platform: esphome
    password: "your ota password here"

wifi:
  ssid: Network name Here
  password: network password here
  ap:
    ssid: "Bambu-Lab-Monitor"
    password: "password here"

captive_portal:

# ─── Display ────────────────────────────────────────────────────────────────

spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO47
  data_pins: [21,48,40,39]

output:
  - platform: ledc
    pin:
      number: 1
    id: gpio_backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO4
    scan: true

display:
  - platform: mipi_spi
    id: my_display
    bus_mode: quad
    update_interval: never
    auto_clear_enabled: False
    model: CUSTOM
    data_rate: 20MHz
    dimensions:
      width: 480
      height: 272
    cs_pin:
      number: 45
      ignore_strapping_warning: true
    invert_colors: false
    init_sequence:
      - [0xff,0xa5]
      - [0x36,0xc0]
