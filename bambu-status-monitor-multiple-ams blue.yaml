  - platform: homeassistant
    id: ha_door
    entity_id: binary_sensor.${printer}_enclosure_door
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: lbl_door
                  text: "Open"
            else:
              - lvgl.label.update:
                  id: lbl_door
                  text: "Closed"

  - platform: homeassistant
    id: ha_hms_errors
    entity_id: binary_sensor.${printer}_hms_errors
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.label.update:
                  id: lbl_hms
                  text: "ERRORS"
              - lvgl.widget.update:
                  id: lbl_hms
                  text_color: 0x00ADAD   # displays as red 0xFF5252
            else:
              - lvgl.label.update:
                  id: lbl_hms
                  text: "Clear"
              - lvgl.widget.update:
                  id: lbl_hms
                  text_color: 0x8919FF   # displays as green 0x00E676

  - platform: homeassistant
    id: ha_filament
    entity_id: binary_sensor.${printer}_extruder_filament_state

# ─── Scripts ─────────────────────────────────────────────────────────────────

script:
  - id: inactivity_timer
    mode: restart
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
          transition_length: 0.3s
      - delay: 60s
      - light.turn_on:
          id: display_backlight
          brightness: 30%
          transition_length: 1s
      - delay: 240s
      - light.turn_off:
          id: display_backlight
          transition_length: 2s

  - id: refresh_ams_page
    then:
      - lvgl.label.update:
          id: lbl_ams_unit
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "AMS %d", id(selected_ams));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_ams_tray1
          text: !lambda |-
            if (id(selected_ams) == 1) return id(ha_ams1_tray1).state;
            if (id(selected_ams) == 2) return id(ha_ams2_tray1).state;
            return id(ha_ams3_tray1).state;
      - lvgl.label.update:
          id: lbl_ams_tray2
          text: !lambda |-
            if (id(selected_ams) == 1) return id(ha_ams1_tray2).state;
            if (id(selected_ams) == 2) return id(ha_ams2_tray2).state;
            return id(ha_ams3_tray2).state;
      - lvgl.label.update:
          id: lbl_ams_tray3
          text: !lambda |-
            if (id(selected_ams) == 1) return id(ha_ams1_tray3).state;
            if (id(selected_ams) == 2) return id(ha_ams2_tray3).state;
            return id(ha_ams3_tray3).state;
      - lvgl.label.update:
          id: lbl_ams_tray4
          text: !lambda |-
            if (id(selected_ams) == 1) return id(ha_ams1_tray4).state;
            if (id(selected_ams) == 2) return id(ha_ams2_tray4).state;
            return id(ha_ams3_tray4).state;
      - lvgl.label.update:
          id: lbl_ams_humidity
          text: !lambda |-
            float v = 0;
            if (id(selected_ams) == 1) v = id(ha_ams1_humidity).state;
            else if (id(selected_ams) == 2) v = id(ha_ams2_humidity).state;
            else v = id(ha_ams3_humidity).state;
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f%%", v);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_ams_temp
          text: !lambda |-
            float v = 0;
            if (id(selected_ams) == 1) v = id(ha_ams1_temp).state;
            else if (id(selected_ams) == 2) v = id(ha_ams2_temp).state;
            else v = id(ha_ams3_temp).state;
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", v);
            return std::string(buf);

# ─── LVGL ────────────────────────────────────────────────────────────────────
# All colors are pre-transformed for BGR-swap + hardware inversion:
#   write_color = swap_rb(invert(desired_color))
# Examples:
#   desired black  0x000000 → write 0xFFFFFF
#   desired green  0x00E676 → write 0x8919FF
#   desired red    0xFF5252 → write 0x00ADAD
#   desired orange 0xFF6E40 → write 0x00BF91  (nozzle)
#   desired blue   0x448AFF → write 0x0075BB  (chamber)

lvgl:
  rotation: 180
  buffer_size: 25%
  log_level: WARN
  color_depth: 16
  touchscreens:
    - my_touchscreen
  displays:
    - my_display

  theme:
    label:
      text_font: roboto_14
      text_color: 0x000000       # displays as white
    obj:
      bg_color: 0xD1E5E5         # displays as dark navy
      border_width: 0
      radius: 4
    arc:
      arc_color: 0xAACCCC        # displays as dark arc bg
      arc_width: 7
      indicator:
        arc_color: 0x8919FF      # displays as green
        arc_width: 7
      knob:
        bg_opa: TRANSP
    bar:
      bg_color: 0xAACCCC         # displays as dark arc bg
      bg_opa: COVER
      radius: 3
      indicator:
        bg_color: 0x8919FF       # displays as green
        radius: 3
    buttonmatrix:
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      items:
        bg_color: 0xC1DEE9       # displays as dark navy card
        bg_opa: COVER
        border_color: 0x9FCBF0   # displays as darker navy border
        border_width: 1
        text_color: 0x5F8787     # displays as muted purple
        text_font: mdi_18
        pressed:
          bg_color: 0x9FCBF0     # displays as darker navy
          text_color: 0x8919FF   # displays as green

  style_definitions:
    - id: style_card
      bg_color: 0xC1DEE9         # displays as dark navy card
      bg_opa: COVER
      radius: 6
      border_width: 1
      border_color: 0x9FCBF0     # displays as darker navy border
      pad_all: 4
      scrollbar_mode: "OFF"

    - id: style_nav
      bg_color: 0xE5F5F5         # displays as near-black
      bg_opa: COVER
      border_width: 0

  pages:

    # ── Status page ──────────────────────────────────────────────────────────
